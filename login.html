<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <style>
        body { 
            background: linear-gradient(135deg, #f5e6a3, #d4af37); 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            width: 90%; 
            max-width: 400px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
            text-align: center; 
        }
        h2 { color: #b8860b; margin-bottom: 20px; }
        input { 
            width: 100%; 
            padding: 15px; 
            margin: 10px 0; 
            border: 1px solid #ddd; 
            border-radius: 10px; 
            box-sizing: border-box; 
        }
        .btn-login { 
            width: 100%; 
            padding: 15px; 
            background: #d4af37; 
            border: none; 
            border-radius: 10px; 
            color: white; 
            font-size: 18px; 
            font-weight: bold;
            cursor: pointer; 
            margin-top: 10px; 
        }
        .link-text { 
            display: block; 
            margin-top: 15px; 
            color: #777; 
            text-decoration: none; 
            font-size: 14px; 
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>تسجيل الدخول</h2>
        <input type="text" placeholder="رقم الهاتف">
        <input type="password" placeholder="كلمة المرور">
        <button class="btn-login">دخول</button>
        <a href="register.html" class="link-text">تسجيل حساب جديد</a>
    </div>

</body>
</html>
