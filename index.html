<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Store</title>
    <style>
        body { background: linear-gradient(135deg, #f5e6a3, #d4af37); font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; max-width: 400px; margin: 20px auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .price-box { font-size: 28px; font-weight: bold; color: #b8860b; margin: 15px 0; }
        .btn { display: block; width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; text-decoration: none; color: white; }
        .btn-gold { background-color: #d4af37; }
        .btn-whatsapp { background-color: #25d366; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Gold Store</h1>
        <p>مرحباً بك في منصتنا</p>
        <div class="price-box">سعر اليوم: <span id="displayPrice">...</span></div>
    </div>

    <div class="card">
        <h3>أقسام الموقع</h3>
        <a href="login.html" class="btn btn-gold">تسجيل الدخول</a>
        <a href="register.html" class="btn btn-gold">إنشاء حساب</a>
    </div>

    <div class="card">
        <h3>تواصل معنا</h3>
        <a href="https://wa.me/201000000000" class="btn btn-whatsapp">تواصل عبر واتساب</a>
    </div>

    <script>
        // كود عرض السعر من لوحة التحكم
        let savedPrice = localStorage.getItem('goldPrice');
        document.getElementById('displayPrice').innerText = savedPrice ? savedPrice : "غير محدد";
    </script>
</body>
</html>
